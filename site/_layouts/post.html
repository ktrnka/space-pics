---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%Y-%m-%d" }} · {{ page.source }} · {{ page.instrument }}</p>
  {{ content }}
  <p class="meta">Credit: {{ page.credit }}. <a href="{{ page.source_url }}">Source</a>. Picker: {{ page.picker }}.</p>
</article>
