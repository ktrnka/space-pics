<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% seo title=false %}
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav><a href="{{ '/feed.xml' | relative_url }}">RSS</a></nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>Images belong to their sources; see the credit on each post. Picked automatically, so expect the occasional dud.</footer>
</body>
</html>
