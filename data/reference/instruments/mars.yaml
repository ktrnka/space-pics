- spacecraft: Perseverance
  instruments:
  - FRONT_HAZCAM_LEFT_A
  - FRONT_HAZCAM_RIGHT_A
  - REAR_HAZCAM_LEFT
  - REAR_HAZCAM_RIGHT
  name: Hazcam (Hazard Avoidance Cameras)
  spacecraft_name: Perseverance rover
  operator: NASA/JPL-Caltech
  what_it_is: 'Six wide-angle engineering cameras bolted to the rover''s body (not the mast): four facing forward
    as two redundant stereo pairs, each pair wired to one of the rover''s two redundant main computers (hence the
    "_A" suffix on the front pair normally in use), and two facing backward as a single rear pair. They share the
    same color sensor design as Navcam but use fisheye optics instead of Navcam''s normal wide lens.

    '
  what_it_sees: 'A fisheye field of view over 130 degrees, pointed down and out to see the ground and the rover''s
    own wheels close up. Perseverance''s Hazcams are color, cropped from the same 20-megapixel sensor as Navcam;
    Curiosity''s equivalent cameras, by contrast, are monochrome at 1024x1024 pixels with a roughly 120-degree fisheye.

    '
  why_it_matters: 'Hazcams spot rocks, drop-offs and sand close to the wheels before the rover moves, and the front
    pair also frames the robotic arm during sample collection and instrument placement.

    '
  reading_the_image: 'Strongly fisheye: straight lines bow outward toward the edges, and the rover''s own wheels,
    shadow or arm often fill part of the frame. Front frames sometimes show the sample-caching arm at work; rear
    frames mostly show tracks and ground just driven over.

    '
  wikipedia: https://en.wikipedia.org/wiki/Hazcam
  spacecraft_wikipedia: https://en.wikipedia.org/wiki/Perseverance_(rover)
