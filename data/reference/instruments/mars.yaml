- spacecraft: Perseverance
  instruments:
  - SKYCAM
  name: MEDA SkyCam
  spacecraft_name: Perseverance rover
  operator: NASA/JPL-Caltech / Centro de Astrobiologia (CSIC-INTA, Spain)
  what_it_is: 'SkyCam is the camera inside the Radiation and Dust Sensor, one part of MEDA (Mars Environmental Dynamics
    Analyzer), Perseverance''s Spanish-built weather station. It''s a repurposed flight-spare Hazcam bolted to the
    rover''s deck and pointed straight up instead of down at the ground.

    '
  what_it_sees: 'Monochrome 1024x1024-pixel fisheye images with a 126-degree circular field of view, shot through
    a red/near-infrared-passing filter (effective wavelength about 691nm). Some sequences instead assemble color
    mosaics covering most of the sky hemisphere.

    '
  why_it_matters: 'Repeated sky images let scientists track clouds, measure dust and haze opacity, and catch dust
    devils passing near the rover - part of characterizing Martian weather and dust behavior relevant to future
    human missions.

    '
  reading_the_image: 'A circular fisheye view of the sky, sometimes with a bit of the rover''s own mast or deck
    hardware poking into the edge of frame. Most frames are a fairly featureless grey or black sky; look closely
    for faint clouds, twilight haze, or the streak of a passing dust devil.

    '
