- spacecraft: Perseverance
  instruments:
  - MCZ_LEFT
  - MCZ_RIGHT
  name: Mastcam-Z
  spacecraft_name: Perseverance rover
  operator: NASA/JPL-Caltech / Arizona State University / Malin Space Science Systems
  what_it_is: 'Mastcam-Z is Perseverance''s main science camera: two identical zoom cameras mounted side by side
    on the mast, one behind each of the rover''s "eyes," giving true stereo vision. Each camera has a 3.6:1 optical
    zoom, equivalent to a 135-400mm lens on a 35mm camera, and was built by Malin Space Science Systems with Arizona
    State University leading the science team.

    '
  what_it_sees: 'Each eye has an 8-position filter wheel behind the zoom lens, producing 1600x1200-pixel frames.
    Position 0 (L0/R0) is a Bayer color filter for ordinary RGB images. Positions 1-6 are narrowband science filters:
    the left eye at 800, 754, 677, 605, 528 and 442nm, the right eye at 800, 866, 910, 939, 978 and 1022nm, spanning
    visible light into the near infrared. Position 7 on each eye is a neutral-density filter for looking directly
    at the sun; those frames are excluded from this feed.

    '
  why_it_matters: 'The narrowband filters let scientists tell minerals and rock coatings apart that look identical
    in plain color, while the zoom and fixed stereo baseline support 3D terrain mapping and let the team pick targets
    for the rover''s arm instruments from a distance.

    '
  reading_the_image: 'Most raw frames look like an ordinary color landscape photo (the L0/R0 Bayer filter). A narrowband
    frame (filter name like ZCAM_L5_528NM) is instead a flat greyscale image of a single wavelength - that''s expected,
    not a bug; several such frames sharing a sequence ID are meant to be stacked later into a false-color composite.
    Frames sharing a sequence ID can also just be tiles of a wider mosaic or panorama.

    '
  wikipedia: https://en.wikipedia.org/wiki/Mastcam-Z
  spacecraft_wikipedia: https://en.wikipedia.org/wiki/Perseverance_(rover)
