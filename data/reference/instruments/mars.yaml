- spacecraft: Curiosity
  instruments:
  - CHEMCAM_RMI
  name: ChemCam RMI (Remote Micro-Imager)
  spacecraft_name: Curiosity rover
  operator: Los Alamos National Laboratory (USA) / CNES-IRAP (France)
  what_it_is: 'ChemCam is a mast-mounted instrument that fires an infrared laser (1067nm) at rock and soil targets
    up to about 7 meters away and reads the flash of vaporized material with a spectrometer - laser-induced breakdown
    spectroscopy (LIBS), the first use of that technique on another planet. A single laser shot barely dents the
    surface; ChemCam fires 30 shots at one spot, discards the first 5 (considered dust-contaminated), and averages
    the rest into a reading of up to 6,144 wavelengths of light. The RMI is ChemCam''s telescope camera, sharing
    the laser''s optics so it sees exactly what was hit.

    '
  what_it_sees: 'A 1024x1024-pixel monochrome CCD behind a 110mm telescope with a 700mm effective focal length,
    giving a narrow field of view of about 20 milliradians - roughly 20cm across at 10 meters, resolving objects
    about 1mm across at that same distance.

    '
  why_it_matters: 'RMI images confirm exactly where the laser hit and document the tiny pit it burns into the rock
    over those 30 pulses; being a small telescope in its own right, it also provides long-distance reconnaissance
    of crater rims and cliffs the rover will never drive to.

    '
  reading_the_image: 'A small circular telescopic view inset in a black square frame, always greyscale. Look for
    pairs of near-identical frames - taken before and after a LIBS burn, where the only difference is a barely visible
    dark pit - or a full 1024x1024 frame used for distant-terrain scouting rather than laser targeting.

    '
  wikipedia: https://en.wikipedia.org/wiki/ChemCam
