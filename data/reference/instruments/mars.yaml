- spacecraft: Perseverance
  instruments:
  - SHERLOC_WATSON
  name: WATSON
  spacecraft_name: Perseverance rover
  operator: NASA/JPL-Caltech
  what_it_is: 'WATSON (Wide Angle Topographic Sensor for Operations and eNgineering) is a color close-up camera
    on the turret at the end of Perseverance''s arm, mounted right next to SHERLOC''s ultraviolet Raman spectrometer.
    It''s built from the same heritage design as Curiosity''s MAHLI camera, giving SHERLOC''s team an ordinary photographic
    view of whatever rock target the spectrometer is probing.

    '
  what_it_sees: 'A 1600x1200-pixel color sensor behind a fixed macro lens with no optical zoom; instead the arm
    moves the whole camera to change scale, focusing from about 2cm off the surface out to infinity. Close up it
    resolves roughly 14 micrometers per pixel, coarsening to around 100 micrometers per pixel farther back.

    '
  why_it_matters: 'WATSON gives geologists an eye-level view of grain size, texture and layering at the exact spot
    SHERLOC''s spectrometer is analyzing for minerals and organic compounds, and the same camera is used for rover
    self-portraits and hardware checks.

    '
  reading_the_image: 'Close-up, well-lit color shots of rock or soil texture, sometimes taken as a stack at slightly
    different distances or as a small mosaic; wider, more distant shots are usually rover selfies or arm/instrument
    inspections rather than science targets.

    '
