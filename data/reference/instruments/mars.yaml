- spacecraft: Curiosity
  instruments:
  - NAV_RIGHT_B
  name: Navcam
  spacecraft_name: Curiosity rover
  operator: NASA/JPL-Caltech
  what_it_is: 'Curiosity carries two identical stereo pairs of black-and-white navigation cameras on its mast -
    four cameras in total - each pair hardwired to one of the rover''s two redundant main computers, nicknamed the
    "A-side" and "B-side." NAV_RIGHT_B is the right-eye camera of the backup B-side pair, normally dormant unless
    the rover has switched computers (as it did after a memory glitch early in the mission).

    '
  what_it_sees: 'Monochrome images with a 45-degree field of view, paired with its left-eye partner (NAV_LEFT_B)
    for stereo depth; mounted just below the A-side pair on the mast, aimed the same direction.

    '
  why_it_matters: 'Stereo navcam pairs are how the rover and its drivers plan safe paths and build 3D terrain models;
    a fully redundant B-side pair means a computer-side swap doesn''t cost the rover its ability to see where it''s
    going.

    '
  reading_the_image: 'An ordinary-looking greyscale wide landscape shot, indistinguishable in content from the A-side
    navcams - only the instrument name in the metadata says which computer captured it.

    '
