- spacecraft: Perseverance
  instruments:
  - SUPERCAM_RMI
  name: SuperCam RMI (Remote Micro-Imager)
  spacecraft_name: Perseverance rover
  operator: CNES / IRAP (France) and Los Alamos National Laboratory (USA)
  what_it_is: 'SuperCam is a turret-mounted mast instrument combining a laser (for elemental and mineral analysis
    from a distance), an infrared spectrometer, a microphone, and a telescope camera called the RMI. It was built
    jointly by the French space agency CNES and the IRAP institute in Toulouse with Los Alamos National Laboratory,
    extending ChemCam''s approach on Curiosity.

    '
  what_it_sees: 'The RMI shares SuperCam''s 110mm-aperture, 563mm-focal-length telescope, recording 2048x2048-pixel
    color images through a narrow circular field of view of about 19 milliradians (roughly 1 degree) - resolving
    detail near 0.24mm per pixel at 3 meters, but also able to pick out crater rims and cliffs kilometers away.

    '
  why_it_matters: 'RMI images document exactly what SuperCam''s laser and spectrometers are pointed at, often shot
    before and after a laser burn so scientists can see the tiny pit left behind, and double as a long-range telescope
    for geology far beyond the rover''s reach.

    '
  reading_the_image: 'A frame shows a small circle of telescopic detail inset in a black square, not a full rectangular
    photo - that circle is the whole field of view, so zoom in rather than expecting it to fill the frame. Wider
    scenes are mosaics stitched from several such tiles.

    '
