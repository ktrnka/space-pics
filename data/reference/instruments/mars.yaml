- spacecraft: MRO
  instruments:
  - hirise
  name: HiRISE
  spacecraft_name: Mars Reconnaissance Orbiter
  operator: University of Arizona / Ball Aerospace & Technologies Corp.
  what_it_is: 'HiRISE is the highest-resolution camera ever sent to orbit another planet: a 0.5-meter reflecting
    telescope, the largest ever flown beyond Earth orbit, with a 12-meter focal length. Ball Aerospace built it;
    the University of Arizona operates it aboard the Mars Reconnaissance Orbiter, which has circled Mars since 2006.

    '
  what_it_sees: 'From MRO''s roughly 300km orbit, HiRISE resolves about 0.3 meters per pixel - individual boulders
    and rover tracks are visible. It scans a long strip as the spacecraft flies overhead; the full-width detector
    is black and white, but a narrower strip down the center is also imaged in three color bands (blue-green 400-600nm,
    red 550-850nm, near-infrared 800-1000nm). A full frame can run to about 20,000 x 126,000 pixels.

    '
  why_it_matters: 'HiRISE scouts and characterizes landing sites, tracks seasonal changes like dust devils and dark
    slope streaks, and provides the ground-truth close-ups that connect rover-scale geology to the orbital picture.

    '
  reading_the_image: 'A top-down, mostly greyscale strip of terrain, sharp enough at full resolution to show rocks,
    dunes and even rover hardware from orbit; color, when present, only runs down the central portion of the frame.
    What''s published here is normally a cropped, downsized detail rather than a full multi-gigapixel swath.

    '
  wikipedia: https://en.wikipedia.org/wiki/HiRISE
