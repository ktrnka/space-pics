- spacecraft: SOHO
  instruments:
  - SOHO LASCO C2
  - SOHO LASCO C3
  name: LASCO
  spacecraft_name: SOHO
  operator: ESA / NASA (LASCO built by the US Naval Research Laboratory)
  what_it_is: 'LASCO is a set of coronagraphs on SOHO: telescopes with a metal disc built in to blot out the Sun''s
    blinding disc, the same trick as a solar eclipse, so the much fainter corona around it becomes visible. C2 and
    C3 are two of LASCO''s three cameras (the innermost, C1, stopped working in 1998); they cover overlapping but
    different distances from the Sun.

    '
  what_it_sees: 'Both are white-light cameras recording sunlight scattered by free electrons in the corona (Thomson
    scattering), not any particular wavelength. C2''s occulting disc blocks the inner 1.5 solar radii and images
    out to about 6 solar radii; C3''s disc blocks out to about 3.7 solar radii and images out to about 30 solar
    radii, a much wider but coarser view.

    '
  why_it_matters: 'LASCO has been the workhorse instrument for watching coronal mass ejections leave the Sun since
    1996, which is why space-weather forecasters still lean on it, and it has incidentally discovered more comets
    than any other instrument in history by imaging small sungrazers crossing its field.

    '
  reading_the_image: 'A coronagraph hides the Sun''s disc behind an occulting disc (the dark circle) to show the
    faint outer corona: Nothing here maps directly onto the
    disc images above; the connection is in time. An eruption seen in AIA 304 or 171 on the disc becomes a coronal
    mass ejection expanding through the LASCO field a few hours later, and streamers here trace the magnetic structures
    rooted in the active regions above. The white circle marks the Sun''s actual size. The dark disc at the centre
    is the occulting mask, not the Sun (a small marker circle usually shows the Sun''s true size and position).
    A bright, expanding cloud or arc moving outward across a sequence of frames is a coronal mass ejection; faint
    radial streaks are the ordinary streamer belt; bright dots crossing the field are usually background stars,
    planets, or sungrazing comets. LASCO frames on this site are normally within minutes of real time.'
