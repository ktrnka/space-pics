- spacecraft: GOES
  instruments:
  - GOES SUVI
  name: SUVI
  spacecraft_name: GOES-19
  operator: NOAA / NASA
  what_it_is: 'SUVI is a full-disc extreme-ultraviolet telescope on NOAA''s newest geostationary weather satellites,
    built to do for round-the-clock space-weather monitoring what instruments like AIA do for solar-physics research.
    It cycles continuously through six wavelength channels.

    '
  what_it_sees: 'SUVI''s six channels, 94, 131, 171, 195, 284 and 304 Å, sample much the same ions and temperatures
    as SDO/AIA and SOHO/EIT: about 630,000 K in 171 Å, several million K in 94 and 131 Å, and the cooler chromosphere
    in 304 Å. Its design and role closely mirror EIT''s.

    '
  why_it_matters: 'SUVI is a core input to NOAA''s operational space-weather forecasts, feeding flare detection
    and coronal-hole tracking used to warn about radiation storms and solar-wind streams headed for Earth.

    '
  reading_the_image: 'SUVI''s 195 Å channel and SDO AIA''s 193 Å channel both isolate the same ion, Fe XII at about
    1.2 million K, so the two should show the same coronal structures from nearly the same vantage; differences
    are mostly resolution (SUVI is a much smaller telescope) and processing. That makes SUVI a good sanity check
    on AIA, and a fallback when SDO data is late. Read it like AIA or EIT at a matching wavelength: dark patches
    are coronal holes, bright knots are active regions, sudden brightening is a flare. Frames on this site are normally
    within minutes of real time.'
