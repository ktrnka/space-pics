- spacecraft: SDO
  instruments:
  - HMIIC
  name: HMI continuum
  spacecraft_name: SDO
  operator: NASA / Stanford University
  what_it_is: 'The Helioseismic and Magnetic Imager (HMI) is SDO''s visible-light instrument, built around filters
    tuned to a single iron spectral line at 617.3 nm. A continuum intensitygram is its plainest product: an ordinary
    white-light snapshot of the visible surface (the photosphere), the closest thing on this site to what your eye
    would see.

    '
  what_it_sees: 'HMI images the full disc at 4096x4096 pixels, roughly 1 arcsecond resolution, updating every 45
    seconds. The continuum frame shows the granulated surface and any sunspots but carries none of the magnetic
    or velocity information HMI is actually built to measure.

    '
  why_it_matters: 'HMI''s main products, not shown here, are dopplergrams (surface motion, used for helioseismology)
    and magnetograms (magnetic field strength and polarity) that map the field lines driving flares and eruptions;
    we don''t yet show either, though they exist in HMI''s data stream.

    '
  reading_the_image: 'Dark, sharp-edged spots are sunspots, cooler regions where a strong magnetic field suppresses
    convection; the mottled texture elsewhere is granulation, the tops of convection cells roughly 1,000 km across.
    The disc''s edge looks dimmer than its centre from limb darkening, not from any real feature.

    '
