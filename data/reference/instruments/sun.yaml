  name: COSMO K-Coronagraph (K-Cor)
  spacecraft_name: Mauna Loa Solar Observatory (ground station, Hawaii)
  operator: NCAR High Altitude Observatory
  what_it_is: 'K-Cor is a ground-based coronagraph on Mauna Loa, Hawaii, one of the few places on Earth''s surface
    clear and dark enough to image the faint corona without going to space. Like the LASCO and COR instruments,
    it uses an occulting disc to block the Sun''s overwhelming disc.

    '
  what_it_sees: 'K-Cor images the polarized "K-corona," visible light from the photosphere scattered by free electrons
    (Thomson scattering), from about 1.05 to 3 solar radii, at roughly 6 arcseconds per pixel. It has operated since
    2013, replacing an older instrument called Mark-IV.

    '
  why_it_matters: 'Being ground-based, K-Cor can run at a much higher cadence than most space coronagraphs, giving
    a fast, near-real-time check on CMEs and other eruptions leaving the low corona, limited to Mauna Loa''s daylight
    and clear weather.

    '
  reading_the_image: 'As with other coronagraphs, the dark central disc is the instrument''s mask, not the Sun;
    an expanding bright cloud or loop is a coronal mass ejection. Because it observes from the ground, frames are
    occasionally missing or degraded by cloud, haze, or daylight scattering.

    '
