- spacecraft: PUNCH
  instruments:
  - PUNCH WFI+NFI
  name: PUNCH Wide Field Imagers and Narrow Field Imager
  spacecraft_name: PUNCH four-satellite constellation
  operator: NASA / Southwest Research Institute
  what_it_is: 'PUNCH is a NASA Small Explorer mission launched in March 2025, made of four small satellites flying
    in formation: three identical Wide Field Imagers (WFI) and one Narrow Field Imager (NFI, a coronagraph). Together
    their images are combined into one continuous polarized view of the corona and inner solar wind.

    '
  what_it_sees: 'NFI covers the innermost corona like a classic coronagraph, while the three WFI satellites tile
    a much larger combined field; together they span roughly 1.5 degrees (about 6 solar radii) out to 45 degrees
    (about 180 solar radii) from the Sun, all in polarized white light.

    '
  why_it_matters: 'PUNCH is built to close the gap between where coronagraphs stop and where the "young" solar wind
    begins, watching a coronal mass ejection continuously as it turns into solar wind rather than losing track of
    it between instruments.

    '
  reading_the_image: 'The combined image usually shows a small occulted disc near the Sun (from NFI) surrounded
    by a much wider, fainter field (from the WFIs) than most coronagraphs show; look for a diffuse, expanding structure
    tracking outward across many frames as a CME crosses the whole field. Frames on this site have run about a month
    behind real time.

    '
