  name: AIA
  spacecraft_name: SDO
  operator: NASA / Lockheed Martin Solar and Astrophysics Laboratory (Stanford runs the joint science operations
    center)
  what_it_is: 'AIA is a set of four telescopes on SDO that photograph the whole visible face of the Sun every 12
    seconds, cycling through ultraviolet and visible-light filters. Nine of its channels are shown here, each tuned
    to a wavelength that only certain hot, ionized atoms emit strongly, which makes AIA closer to a thermometer
    than a plain camera. SDO has flown in a geosynchronous orbit above the Americas since 2010, giving nearly uninterrupted
    coverage.

    '
  what_it_sees: 'Each channel isolates one temperature layer of the solar atmosphere; the colors are false and
    assigned by convention. 304 Å, He II, about 50,000 K, red: chromosphere and prominences. 171 Å, Fe IX, about
    630,000 K, gold: quiet corona and coronal loops. 193 Å, Fe XII (and Fe XXIV in flares), about 1.2 million K:
    corona and coronal holes. 211 Å, Fe XIV, about 2 million K: active regions. 335 Å, Fe XVI, about 2.5 million
    K: active regions. 94 Å, Fe XVIII, about 6 million K: flaring plasma. 131 Å, Fe VIII plus Fe XXI/XXIII, roughly
    400,000 K to 16 million K: flares across a wide temperature range. 1600 Å, C IV plus continuum, about 100,000
    K and 5,000 K: transition region and photosphere. 1700 Å, continuum, about 5,000 K: photosphere. Native frames
    are 4096x4096 pixels at 0.6 arcsec/pixel; this site uses NASA''s 1024 px browse copies.

    '
  why_it_matters: 'Comparing the same moment across channels lets researchers map how hot different parts of the
    solar atmosphere are and follow flares, filament eruptions, and coronal mass ejections as they unfold.

    '
  reading_the_image: 'A note on the labels: ''Fe XIV'' is spectroscopists'' shorthand for an iron atom that has
    lost 13 of its electrons (I is neutral, II has lost one, and so on). Stripping that many electrons takes a temperature
    of about 2 million K, and each ion glows at its own set of wavelengths, so tuning a channel to the 211 Å line
    of Fe XIV is a way of photographing only the gas at that temperature. That is why each AIA channel is really
    a temperature map, and why the same active region looks different from channel to channel. Dark patches in 193
    or 211 are coronal holes (open field, source of fast solar wind); bright tangled patches are active regions
    over sunspots; dark thread-like filaments on the disc in 304 are the same structures seen as bright prominences
    when they curve above the limb. A sudden bright flash in 131 or 94 is a flare.'
