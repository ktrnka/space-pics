- spacecraft: SOHO
  instruments:
  - SOHO EIT
  name: Extreme ultraviolet Imaging Telescope (EIT)
  spacecraft_name: SOHO
  operator: ESA / NASA
  what_it_is: 'EIT was one of the first instruments to routinely image the whole solar corona in extreme ultraviolet
    light, showing structure invisible in ordinary visible light. Each of its four channels isolates a different
    temperature of coronal or chromospheric plasma by choosing a wavelength one particular ion emits strongly.

    '
  what_it_sees: '171 Å, Fe IX/Fe X, about 1 million K: quiet corona. 195 Å, Fe XII, about 1.5 million K: general
    corona, EIT''s main channel. 284 Å, Fe XV, about 2 million K: hotter active-region plasma. 304 Å, He II, roughly
    60,000 to 80,000 K: chromosphere and transition region, including filaments and prominences. Full-disc frames
    update every 12 to 25 minutes depending on channel.

    '
  why_it_matters: 'EIT''s long, continuous record since 1996 underlies much of what''s known about coronal holes,
    how coronal mass ejections start, and how the low corona changes over a solar cycle, even though newer instruments
    have since taken over as the primary EUV imagers.

    '
  reading_the_image: 'As with AIA, filaments look dark against the disc in 304 and bright at the limb as prominences;
    coronal holes are dark patches in 171/195; bright compact knots are active regions. EIT frames on this site
    typically run about three weeks behind real time, since its archive is slower to release than the newer instruments.

    '
