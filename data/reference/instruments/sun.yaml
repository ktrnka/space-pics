    from STEREO-A''s separate vantage point away from the Earth-Sun line.

    '
  what_it_sees: 'COR1 covers the inner corona, roughly 1.4 to 4 solar radii; COR2 covers a wider outer range, roughly
    2 to 15 solar radii, overlapping LASCO C2/C3''s coverage but seen from a different angle. Both record ordinary
    sunlight scattered by coronal electrons rather than a specific wavelength.

    '
  why_it_matters: 'Viewing a coronal mass ejection from two separated vantage points, Earth-based LASCO plus STEREO-A,
    lets scientists triangulate its true speed and direction instead of estimating from one flat image.

    '
  reading_the_image: 'The dark disc at the centre is the instrument''s occulting mask, not the Sun; an expanding
    bright arc or cloud across a sequence of frames is a coronal mass ejection, and thin radial streaks are the
    ordinary streamer belt. Frames on this site typically run about three days behind real time.

    '
