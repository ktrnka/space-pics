- spacecraft: GONG
  instruments:
  - GONG H-alpha
  name: GONG H-alpha network
  spacecraft_name: Global Oscillation Network Group (six ground-based telescopes)
  operator: NSF / National Solar Observatory
  what_it_is: 'GONG is not a spacecraft but a network of six identical ground telescopes spread around the world
    (Big Bear in California, Mauna Loa in Hawaii, Learmonth in Australia, Udaipur in India, Teide in the Canary
    Islands, and Cerro Tololo in Chile), positioned so at least one station has the Sun in daylight almost all the
    time. Its main job is helioseismology, but each station also takes plain hydrogen-alpha images of the chromosphere.

    '
  what_it_sees: 'H-alpha is a red visible-light spectral line (656.3 nm) emitted by hydrogen in the chromosphere,
    a thin layer just above the visible surface. GONG''s H-alpha camera photographs the full disc roughly every
    20 seconds from whichever station currently has the best view.

    '
  why_it_matters: 'H-alpha shows fine chromospheric detail invisible in white light or most EUV channels, especially
    the shape of filaments and flare ribbons, which is why it has been a staple of ground-based flare monitoring
    for decades.

    '
  reading_the_image: 'Dark, thread-like filaments crossing the disc are cool plasma suspended by magnetic fields;
    bright patches (plage) surround active regions; a sudden bright ribbon-shaped brightening is a flare. Because
    stations hand off through the day, image quality can vary with local weather and seeing.

    '
