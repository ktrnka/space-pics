  spacecraft_name: PROBA-2 satellite
  operator: ESA / Royal Observatory of Belgium
  what_it_is: 'SWAP is a small, low-cost extreme-ultraviolet telescope on ESA''s PROBA-2, a technology-demonstration
    satellite that also carries genuine solar-physics instruments. It photographs the full solar disc and a bit
    of the surrounding corona in a single EUV channel.

    '
  what_it_sees: 'SWAP observes at 174 Å (Fe IX/Fe X), showing plasma around 1 million K, similar to AIA''s or EIT''s
    171 Å channel but from a compact, cheaper instrument. Its images routinely extend further off the disc than
    most EUV imagers, sometimes showing corona out to 2 solar radii or more.

    '
  why_it_matters: 'SWAP gives near-continuous, low-cost monitoring of the corona for space-weather purposes, backing
    up the larger SOHO and SDO missions and occasionally catching CME onsets and EUV waves.

    '
  reading_the_image: 'Read it like a 171 Å AIA or EIT frame: dark patches are coronal holes, bright knotted regions
    are active regions, faint structure fading outward past the disc''s edge is the extended corona. Frames on this
    site are normally within minutes of real time.

    '
