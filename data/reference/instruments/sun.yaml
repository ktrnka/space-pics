- spacecraft: Solar Orbiter
  instruments:
  - Solar Orbiter SoloHI
  name: Solar Orbiter Heliospheric Imager (SoloHI)
  spacecraft_name: Solar Orbiter spacecraft
  operator: ESA / NASA (built by the US Naval Research Laboratory)
  what_it_is: 'SoloHI is a wide-field imager on Solar Orbiter that, unlike a coronagraph, has no occulting disc;
    it instead points off to the side of the Sun to photograph the faint white light scattered by the solar wind
    and interplanetary dust.

    '
  what_it_sees: 'SoloHI records ordinary sunlight Thomson-scattered by electrons in the solar wind, across a wide
    field built from four camera tiles spanning about 20 degrees half-angle, tracing the solar wind and CMEs well
    beyond where coronagraphs stop.

    '
  why_it_matters: 'SoloHI extends the heliospheric-imaging approach pioneered by STEREO''s HI cameras, tracking
    CMEs and solar-wind structures out into space rather than just near the Sun, which helps predict when and how
    hard a CME will hit Earth or Solar Orbiter itself.

    '
  reading_the_image: 'Expect a faint, textured field flecked with stars and dust streaks rather than a crisp solar
    disc; a CME shows up as a diffuse brightening or arc sweeping across the frame over many hours. Frames on this
    site have run about five months behind real time.

    '
