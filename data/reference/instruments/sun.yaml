  name: X-Ray Telescope (XRT)
  spacecraft_name: Hinode solar observatory satellite
  operator: JAXA / NASA / UK Space Agency (built by the Smithsonian Astrophysical Observatory)
  what_it_is: 'XRT is a soft X-ray telescope on Hinode, a Japanese-led solar satellite launched in 2006 that also
    carries a visible-light telescope (SOT) and a UV spectrometer (EIS). Unlike the EUV imagers elsewhere on this
    site, XRT images the hottest solar plasma directly in X-rays, light only very hot material emits.

    '
  what_it_sees: 'XRT is sensitive to plasma from about 1 million K up to 10 million K, imaging the disc and corona
    at up to 1 arcsecond per pixel over a 34 arcminute field of view.

    '
  why_it_matters: 'Tuned to the hottest end of the corona, XRT shows structures like X-ray bright points and hot
    flare loops that cooler EUV channels miss or saturate on, useful for studying coronal heating and flares alongside
    Hinode''s other instruments.

    '
  reading_the_image: 'Bright compact spots scattered across the disc away from any obvious active region are X-ray
    bright points, small transient heating events; large bright loop systems are active-region cores. The corona
    looks patchier and less uniform than in EUV images because only the hottest plasma shows up at all.

    '
