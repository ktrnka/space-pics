- spacecraft: SDO
  instruments:
  - '211193171'
  name: AIA 211/193/171 composite
  spacecraft_name: SDO
  operator: NASA / Lockheed Martin Solar and Astrophysics Laboratory
  what_it_is: 'A single false-color image made by blending three AIA ultraviolet channels the way a color camera
    blends red, green and blue. It is not a natural-light photo of the Sun; it is a way to show three temperatures
    of coronal plasma in one image that reads more easily at a glance than three separate grey frames.

    '
  what_it_sees: 'By standard convention, 211 Å (Fe XIV, about 2 million K) is mapped to red, 193 Å (Fe XII, about
    1.2 million K) to green, and 171 Å (Fe IX, about 630,000 K) to blue, then combined. Corona bright in all three
    channels looks golden-white; structures bright mainly in the cooler 171 Å channel look blue; hotter, more disturbed
    plasma trends toward orange and red.

    '
  why_it_matters: 'This is the composite NASA and space-weather forecasters use as a quick "state of the corona"
    view, because it shows active regions, coronal holes, and loop structure together without switching between
    channels.

    '
  reading_the_image: 'Dark, blue-tinted patches are coronal holes; bright orange-white knots are active regions;
    fine looping strands are coronal loops tracing magnetic field lines. Color balance can shift slightly frame
    to frame since the three source channels are processed independently.

    '
