  spacecraft_name: Solar Orbiter spacecraft
  operator: ESA / NASA (built by a European consortium led by the Royal Observatory of Belgium)
  what_it_is: 'EUI is Solar Orbiter''s ultraviolet camera system: FSI (Full Sun Imager) photographs the whole disc,
    while HRI (High Resolution Imager) zooms in on a small patch at much finer detail. Both are especially valuable
    when Solar Orbiter''s orbit swings it closer to the Sun than any other imaging mission.

    '
  what_it_sees: 'FSI images at 174 Å (corona, roughly 1 million K) and 304 Å (chromosphere, He II); HRI has separate
    channels at 174 Å and, uniquely among instruments on this site, 1216 Å Lyman-alpha light from atomic hydrogen,
    which highlights the chromosphere and transition region.

    '
  why_it_matters: 'Because Solar Orbiter periodically swings well out of the Sun-Earth line and closer to the Sun
    than Mercury, EUI can see solar features from angles and at resolutions Earth-orbiting instruments cannot.

    '
  reading_the_image: 'Read FSI''s 174 Å like AIA''s 171 Å (coronal holes dark, active regions bright). Solar Orbiter''s
    science archive releases slowly, so EUI frames on this site can be well over a year old by the time they''re
    shown, useful for context rather than "what''s happening now."

    '
