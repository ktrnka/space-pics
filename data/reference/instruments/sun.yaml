  operator: NASA / Naval Research Laboratory
  what_it_is: 'EUVI is the extreme-ultraviolet imager in the SECCHI instrument suite on STEREO-A, one of two nearly
    identical spacecraft launched in 2006 to view the Sun from a different angle than Earth. Its twin, STEREO-B,
    was lost in 2014; STEREO-A remains active and slowly drifts around the Sun on its own orbit, periodically seeing
    the side of the Sun not visible from Earth.

    '
  what_it_sees: 'EUVI images the disc in the same four EUV channels as SOHO/EIT: 171 Å (Fe IX, quiet corona), 195
    Å (Fe XII, general corona), 284 Å (Fe XV, hot active regions) and 304 Å (He II, chromosphere and prominences),
    at similar field of view and resolution to EIT.

    '
  why_it_matters: 'Because STEREO-A sits at a different longitude than Earth, EUVI gives a preview of active regions
    before they rotate into Earth''s view, useful for flare and CME forecasting.

    '
  reading_the_image: 'Read it like EIT or AIA at a matching wavelength: dark patches are coronal holes, bright knots
    are active regions, dark threads on the disc in 304 are filaments. Frames on this site typically run about three
    days behind real time.

    '
